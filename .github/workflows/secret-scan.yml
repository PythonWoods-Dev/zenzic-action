# This workflow was 22 lines, one step, and two `echo` statements deferring to a
# platform feature that was disabled everywhere. It reported success on every
# commit and had never scanned anything.
#
# It now runs the ecosystem's own scanner over every tracked file. Two layers,
# deliberately different and neither subsuming the other: this one applies Zenzic's
# signature set to the checkout, and GitHub's native secret scanning (enabled on all
# four repositories on 2026-09-12) applies its provider list to the full history.
#
# This repository carries **no credential fixtures** -- measured, not assumed:
# `zenzic guard scan` over its 58 tracked files reports zero findings -- so its
# allowlist is empty and the check is strictly stronger than the core's, which has two
# fixtures forgiven by path *and* secret type together.

name: Zenzic Action Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The script self-tests before rendering any verdict, so a broken instrument
      # cannot report clean, and it prints the file count -- "passed" and "looked at
      # nothing" must not be the same string. That is exactly how the no-op survived.
      - name: Scan every tracked file for credentials
        run: python3 scripts/ci_secret_scan.py
