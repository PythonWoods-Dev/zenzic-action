name: Zenzic Action CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # required for upload-sarif

jobs:
  verify:
    name: Verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu: full verify (pre-commit + check + nox tests)
          - os: ubuntu-latest
            lint: true
          # Windows: validate action logic and OS-level path handling only.
          # pre-commit is skipped: Node hook (markdownlint) triggers thousands
          # of small-file I/O operations that freeze the Windows runner.
          # Linting is enforced by the Ubuntu slot.
          # - os: windows-latest
          #   lint: false
    defaults:
      run:
        shell: bash
    # ZRT-010 — Sovereign Parity: Pre-Launch Guard lives in justfile.
    # Local and CI run identical 'just check' invocations.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine Zenzic Core Branch (Parity or Fallback)
        id: resolve-branch
        shell: bash
        env:
          # Optional explicit parity override for non-homonymous branch topologies.
          # Example: set repository variable ZENZIC_CORE_REF=release/v0.8.0
          ZENZIC_CORE_REF: ${{ vars.ZENZIC_CORE_REF }}
          # Override governance metadata (required when ZENZIC_CORE_REF is set).
          ZENZIC_CORE_REF_TICKET: ${{ vars.ZENZIC_CORE_REF_TICKET }}
          ZENZIC_CORE_REF_REASON: ${{ vars.ZENZIC_CORE_REF_REASON }}
          ZENZIC_CORE_REF_APPROVER: ${{ vars.ZENZIC_CORE_REF_APPROVER }}
          ZENZIC_CORE_REF_EXPIRES_ON: ${{ vars.ZENZIC_CORE_REF_EXPIRES_ON }}
        run: |
          TARGET_BRANCH="${{ github.base_ref || github.ref_name }}"
          echo "Target branch is: $TARGET_BRANCH"

          if [[ -n "${ZENZIC_CORE_REF:-}" ]]; then
            echo "Explicit core ref override requested: $ZENZIC_CORE_REF"

            missing=0
            for key in ZENZIC_CORE_REF_TICKET ZENZIC_CORE_REF_REASON ZENZIC_CORE_REF_APPROVER ZENZIC_CORE_REF_EXPIRES_ON; do
              if [[ -z "${!key:-}" ]]; then
                echo "::error::$key is required when ZENZIC_CORE_REF is set."
                missing=1
              fi
            done
            if [[ "$missing" -ne 0 ]]; then
              exit 1
            fi

            if [[ ! "$ZENZIC_CORE_REF_EXPIRES_ON" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::ZENZIC_CORE_REF_EXPIRES_ON must use ISO format YYYY-MM-DD."
              exit 1
            fi

            CURRENT_DATE="$(date -u +%F)"
            if [[ "$ZENZIC_CORE_REF_EXPIRES_ON" < "$CURRENT_DATE" ]]; then
              echo "::error::ZENZIC_CORE_REF override expired on $ZENZIC_CORE_REF_EXPIRES_ON (current UTC date: $CURRENT_DATE)."
              exit 1
            fi

            if git ls-remote --exit-code --heads https://github.com/PythonWoods-Dev/zenzic.git "$ZENZIC_CORE_REF" > /dev/null 2>&1; then
              echo "Override branch exists in core. Using it."
              {
                echo "### Governed Core Override"
                echo "- core_ref: $ZENZIC_CORE_REF"
                echo "- ticket: $ZENZIC_CORE_REF_TICKET"
                echo "- approver: $ZENZIC_CORE_REF_APPROVER"
                echo "- expires_on: $ZENZIC_CORE_REF_EXPIRES_ON"
                echo "- reason: $ZENZIC_CORE_REF_REASON"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "core_ref=$ZENZIC_CORE_REF" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "::error::ZENZIC_CORE_REF '$ZENZIC_CORE_REF' not found in PythonWoods-Dev/zenzic."
            exit 1
          fi

          # Priority 2: an explicit, committed declaration that this branch
          # depends on a specific zenzic core ref. Replaces the old "does a
          # same-named branch happen to exist in core" heuristic, which
          # silently fell back to main on ANY name mismatch -- the same risk
          # already found and fixed in zenzic-vscode's identical pattern
          # (V031_SOVEREIGN_PARITY_ROBUST_FALLBACK). The governed
          # ZENZIC_CORE_REF override above stays Priority 1 unchanged.
          if [[ -f ".zenzic-core-ref" ]]; then
            DECLARED_REF="$(tr -d '[:space:]' < .zenzic-core-ref)"
            if [[ -z "$DECLARED_REF" ]]; then
              echo "::error::.zenzic-core-ref exists but is empty. Put a real zenzic branch/tag name in it, or delete the file to use main."
              exit 1
            fi
            if git ls-remote --exit-code --heads --tags https://github.com/PythonWoods-Dev/zenzic.git "$DECLARED_REF" > /dev/null 2>&1; then
              echo "Declared core ref (.zenzic-core-ref): $DECLARED_REF -- found in core, using it."
              echo "core_ref=$DECLARED_REF" >> $GITHUB_OUTPUT
            else
              echo "::error::.zenzic-core-ref declares '$DECLARED_REF', but no matching branch or tag exists in PythonWoods-Dev/zenzic. Update .zenzic-core-ref to a real ref, or delete the file to fall back to main. Falling back silently here is exactly the failure mode this file exists to prevent."
              exit 1
            fi
            exit 0
          fi

          # No declaration and no override: this branch has not asked for a
          # specific core ref, so main is the correct, ordinary default --
          # not a fallback from a failed match, and nothing to warn about.
          echo "No .zenzic-core-ref declaration and no ZENZIC_CORE_REF override -- using zenzic's main (no cross-repo core coupling declared for this branch)."
          echo "core_ref=main" >> $GITHUB_OUTPUT

      - name: Checkout local zenzic (unreleased)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PythonWoods-Dev/zenzic
          ref: ${{ steps.resolve-branch.outputs.core_ref }}
          path: _zenzic_core
          fetch-tags: true

      - name: Install just
        uses: taiki-e/install-action@ea85faa6acd705ad6d40586db99f1a70b09c2929 # just

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run Zenzic Quality Gate
        shell: bash
        env:
          # Shared sovereign contract: explicit override first.
          ZENZIC_CORE_PATH: _zenzic_core
          # Runtime-only injection point for local isolation checks in CI.
          ZENZIC_EXTRA_ARGS: ${{ secrets.ZENZIC_EXTRA_ARGS }}
        # Ubuntu: full verify (pre-commit + check + nox tests).
        # Windows: skip pre-commit — Node hook freezes GHA Windows runners.
        # Linting is enforced by the Ubuntu slot.
        run: |
          if [[ "${{ matrix.lint }}" == "true" ]]; then
            just verify
          else
            just check
            just test
          fi

      - name: Test Action Locally
        uses: ./
        with:
          working-directory: tests/fixture
          check-stamp: "false"
          upload-sarif: "false"

      - name: Test Action Locally with Z001 Config Error Fixture
        id: test-z001
        uses: ./
        continue-on-error: true
        with:
          working-directory: _zenzic_core/examples/z001-config-error
          fail-on-error: "true"
          check-stamp: "false"
          upload-sarif: "false"

      - name: Assert Z001 Failure
        shell: bash
        run: |
          if [[ "${{ steps.test-z001.outcome }}" != "failure" ]]; then
            echo "::error::Expected action to fail on Z001 config-error fixture, but it passed."
            exit 1
          fi
          echo "✓ Action correctly failed on Z001 configuration error."
