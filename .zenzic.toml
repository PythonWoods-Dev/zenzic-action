# Precedence: .zenzic.toml is shared baseline; .zenzic.local.toml overrides locally.
# Keep secrets and workstation-only values in .zenzic.local.toml.

# --- PROJECT IDENTITY ---
# [project]
# name = "zenzic-action" # Used for personalized CLI Governance headers

# --- CORE SETTINGS ---
# ---------------------------------------------------------------------------
# docs_dir
# ---------------------------------------------------------------------------
# The relative path to your documentation root.
#
# BEHAVIOR:
#   - If commented out (default), Zenzic uses "docs" as the documentation root.
#   - Set to "." to scan the entire repository (L1 system exclusions apply).
#
# DEFAULT: "docs"
#
docs_dir = "."

strict = true
# fail_under = 100 - suppression_cap, the relation the generated configuration states
# (fail_under <= 100 - suppression_cap). Re-derived 2026-09-18: with the cap back to 0 --
# the one provisional pair was deleted when the core LICENSE defect was fixed -- the
# relation gives 100, and the repository measures 100 with zero suppressions in use.
fail_under = 100
# exit_zero = false
# respect_vcs_ignore = true
# validate_same_page_anchors = true

excluded_external_urls = []


# Z204 Privacy Gate — terms that must never appear in published docs.
# forbidden_patterns = []

# --- EXCLUSION ZONES (Full bypass — use sparingly) ---
# Paths listed here are INVISIBLE to Zenzic: no findings, no audit trail.
# Prefer [governance.per_file_ignores] for targeted suppression with an audit trail.
excluded_dirs = [
    "scripts",
    "LICENSES",
    "_zenzic_core",  # CI checkout of sibling core repo — not action documentation
]
excluded_file_patterns = ["RELEASE.md"]
# excluded_assets = ["favicon.ico"]
# excluded_asset_dirs = ["theme/"]
# excluded_build_artifacts = ["pdf/*.pdf"]
# included_dirs = []
# included_file_patterns = []

# --- PLUGINS (Optional) ---
# plugins = []

# --- PLACEHOLDERS & CODE SNIPPETS (Optional) ---
placeholder_patterns = []

# --- ENGINE CONTEXT ---
[build_context]
engine         = "standalone" # Supported: mkdocs, zensical, standalone
base_url       = "/"
default_locale = "en"

# --- BRAND INTEGRITY ---
[project_metadata]
release_name = "Magnetite"

[governance]
# ---------------------------------------------------------------------------
# suppression_cap
# ---------------------------------------------------------------------------
# Hard-fail threshold for technical debt.
#
# BEHAVIOR:
#   - If total suppressions > cap: CI fails immediately (Exit Code 1).
#   - Scoring: Every suppression in use costs 1 DQS point (Flat-Cost Model).
#
# suppression_cap = 0, re-derived 2026-09-18 when the core defect was fixed. The cap was
# PROVISIONAL at 1 for exactly one pair -- the two README.md links to LICENSE, reported
# because the core kept LICENSE out of its site map while its link rule looked for it
# there. With that fixed the pair suppressed nothing and was deleted, so this project now
# has zero suppressions in use and the cap measures that real state. The default of 30 is
# not calibrated for any project: it began as the free allowance of a retired scoring model.
suppression_cap = 0
suppression_cap_fail_hard = true

# Terms that should no longer appear in your documentation.
brand_obsolescence = [
    "Basalt",
    "Quartz",
    "Obsidian",
    "Graphite"
]
# suppression_cap_scope = "all"  # Options: all, per-file
# i18n_parity = false            # Set true when i18n is enabled

# ---------------------------------------------------------------------------
# per_file_ignores
# ---------------------------------------------------------------------------
# Silence a rule for specific file globs.
#
# BEHAVIOR: ADDITIVE — each (pattern, code) pair in use adds 1 pt of Technical Debt.
# IMPACT:   directory_policies below cost the same per pair; use them to declare a tree once.
#
# [governance.per_file_ignores]
# "docs/legacy/**"      = ["Z601"]  # intentional brand refs → -1 pt
# "docs/migration/*.md" = ["Z101"]  # known broken links → -1 pt

# ---------------------------------------------------------------------------
# directory_policies
# ---------------------------------------------------------------------------
# Strategic exemptions for entire directory trees or specific files.
#
# BEHAVIOR: Matched findings are dropped; each (pattern, code) pair in use adds 1 pt of Technical Debt.
# IMPACT:   In --audit mode, shown with [POLICY_EXEMPTION] label.
#
[governance.directory_policies]
# `"**" = ["Z106"]` was removed 2026-09-13. Z106 (CIRCULAR_LINK) became opt-in and
# defaults to off, so a corpus-wide exemption for it suppressed nothing and Z620
# reported it as dead configuration. Nothing replaces it: this repository does not
# opt into cycle detection, so there is no finding to exempt.
# `"README.md" = ["Z101"]` was removed 2026-09-18. It silenced the two LICENSE links, which
# the core reported because it kept LICENSE out of the site map while its link rule looked
# for it there. That core defect is fixed: legal files are indexed as static assets, so the
# links resolve and the pair suppressed nothing -- Z620 reported it as dead configuration.
# `"assets/**" = ["Z405"]` was removed 2026-09-15: the wordmark is referenced from README.md
# through <source srcset>, which the unused-asset check now reads, so the entry suppressed
# nothing and was reported as dead configuration.
# `"changelogs/**" = ["Z410", "Z411", "Z513"]` and `"CODE_OF_CONDUCT.md" = ["Z411", "Z511"]`
# were removed 2026-09-15. Z411, Z511 and Z513 became opt-in and default to off, and
# Z410 never fires on changelogs/, so all five suppressed nothing and were reported as
# dead configuration.

# Governance Playbook:
# https://zenzic.dev/developers/how-to/release-governance-protocol



# --- CUSTOM RULES (Optional) ---
# Declares project-specific regex-based lint rules applied line-by-line.
[[custom_rules]]
id       = "ZZ-NOCLICKHERE"
pattern  = "(?i)\\bclick here\\b|\\bclicca qui\\b"
message  = "Avoid generic link text. Use a meaningful description for accessibility."
severity = "error"

